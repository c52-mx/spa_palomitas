  *{box-sizing:border-box} [v-cloak]{display:none}
  body{margin:0;background:var(--crema);color:var(--tinta);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  h1,h2{margin:0;font-weight:800}
  .top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--linea);background:#fff}
  .top .sp{margin-left:auto}
  button{font:inherit;cursor:pointer}
  .btn{border:1.5px solid var(--baya);background:var(--baya);color:#fff;border-radius:9px;padding:8px 14px;font-weight:800}
  .btn.ghost{background:#fff;color:var(--baya)}
  .btn.sm{padding:5px 10px;font-size:.85rem}
  .btn.gray{border-color:var(--linea);background:#fff;color:var(--tinta)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
  .tabs button{border:1.5px solid var(--linea);background:#fff;color:var(--suave);border-radius:999px;padding:7px 14px;font-weight:800}
  .tabs button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:10px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
  label{display:block;font-size:.72rem;font-weight:800;color:var(--suave);margin-bottom:3px}
  input,select,textarea{width:100%;border:1.5px solid var(--linea);background:#fffdf8;border-radius:8px;padding:8px;font:inherit;font-weight:600;color:var(--tinta)}
  .chk{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem}
  .chk input{width:auto}
  .acts{display:flex;gap:6px;margin-top:10px}
  .msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .login{max-width:360px;margin:12vh auto;text-align:center}
  .login .card{padding:22px;text-align:left}
  .pill{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px}
  .pill.on{background:#E9FBEF;color:var(--ok)} .pill.off{background:#F3ECDF;color:var(--suave)}
  .muted{color:var(--suave);font-weight:600;font-size:.85rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
  .stat{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px}
  .stat .k{display:block;font-size:.72rem;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
  .stat b{display:block;font-size:1.5rem;margin:3px 0 0}
  .bar{height:8px;background:#F1E6CE;border-radius:6px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--baya)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .warn{max-width:520px;margin:12vh auto;text-align:center;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:22px}
  code{background:#F3ECDF;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- sin llaves -->
  <div v-if="!USA_SB" class="warn">
    <h2>Falta configurar Supabase</h2>
    <p class="muted">Abre este archivo y pega tu <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> arriba del script. Luego recarga.</p>
  </div>

  <!-- login -->
  <div v-else-if="!sesion" class="login">
    <h1>Las Palomitas de los Abuelos 🍿</h1>
    <div class="card">
      <label>Correo</label>
      <input v-model="email" type="email" placeholder="tucorreo@ejemplo.com" @keyup.enter="login">
      <label style="margin-top:10px">Contraseña</label>
      <input v-model="password" type="password" @keyup.enter="login">
      <button class="btn" style="width:100%;margin-top:14px" @click="login">Entrar</button>
      <p v-if="loginErr" class="muted" style="color:var(--baya);margin-top:8px">{{ loginErr }}</p>
    </div>
  </div>

  <!-- dashboard -->
  <template v-else>
    <div class="top">
      <span style="width:28px;height:28px;background:var(--logo) center/contain no-repeat;display:inline-block;vertical-align:middle;margin-right:6px"></span><strong>{{ config.negocio || 'Las Palomitas de los Abuelos' }}</strong>
      <span class="sp"></span>
      <span class="muted">{{ sesion.user?.email }}</span>
      <button class="btn ghost sm" @click="logout">Salir</button>
    </div>
    <div class="wrap">
      <div class="tabs">
        <button v-for="t in TABS" :key="t.id" :class="{on:tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
      </div>

      <!-- RESUMEN -->
      <div v-show="tab==='resumen'">
        <div class="stats">
          <div class="stat"><span class="k">Pedidos hoy</span><b>{{ stats.hoyN }}</b><span class="muted">${{ stats.hoyMonto }} en el dia</span></div>
          <div class="stat"><span class="k">Anticipos por cobrar</span><b>${{ stats.anticipos }}</b><span class="muted">pendiente + confirmado</span></div>
          <div class="stat"><span class="k">Ventas confirmadas</span><b>${{ stats.ventas }}</b><span class="muted">confirmado + entregado</span></div>
          <div class="stat"><span class="k">Pedidos totales</span><b>{{ stats.total }}</b><span class="muted">historico</span></div>
        </div>
        <div class="card">
          <b>Por estatus</b>
          <div class="badges" style="margin-top:8px">
            <span class="pill off">Pendiente: {{ stats.est.pendiente }}</span>
            <span class="pill off">Confirmado: {{ stats.est.confirmado }}</span>
            <span class="pill on">Entregado: {{ stats.est.entregado }}</span>
            <span class="pill off">Cancelado: {{ stats.est.cancelado }}</span>
          </div>
        </div>
        <div class="card">
          <b>Top sabores / productos</b>
          <p v-if="!stats.topProductos.length" class="muted" style="margin-top:6px">Aun sin datos de pedidos.</p>
          <div v-for="p in stats.topProductos" :key="p.nombre" style="margin-top:10px">
            <div style="display:flex;justify-content:space-between;font-weight:700"><span>{{ p.nombre }}</span><span>{{ p.qty }}</span></div>
            <div class="bar"><i :style="{width:(p.qty/stats.maxTop*100)+'%'}"></i></div>
          </div>
        </div>
      </div>

      <!-- SABORES -->
      <div v-show="tab==='sabores'">
        <div class="card" v-for="s in sabores" :key="s.id">
          <div class="row">
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="s.nombre"></div>
            <div><label>Categoría</label><select v-model="s.cat"><option>salado</option><option>dulce</option><option>icee</option></select></div>
            <div><label>Emoji</label><input v-model="s.icon"></div>
            <div><label>Badge</label><input v-model="s.badge"></div>
            <div><label>Stock (vacío = sin límite)</label><input v-model.number="s.stock" type="number"></div>
            <div><label>Foto (url)</label><input v-model="s.img"></div>
          </div>
          <div class="acts">
            <label class="chk"><input type="checkbox" v-model="s.disponible"> Disponible</label>
            <span class="sp" style="flex:1"></span>
            <button class="btn sm" @click="guardar('sabores',s)">Guardar</button>
            <button class="btn gray sm" @click="eliminar('sabores',s)">Eliminar</button>
          </div>
        </div>
        <div class="card">
          <b>Agregar sabor</b>
          <div class="row" style="margin-top:8px">
            <div><label>id (slug)</label><input v-model="nuevo.sabores.id" placeholder="ej. mango"></div>
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="nuevo.sabores.nombre"></div>
            <div><label>Categoría</label><select v-model="nuevo.sabores.cat"><option>salado</option><option>dulce</option><option>icee</option></select></div>
            <div><label>Emoji</label><input v-model="nuevo.sabores.icon"></div>
          </div>
          <div class="acts"><button class="btn sm" @click="agregar('sabores')">Agregar</button></div>
        </div>
      </div>

      <!-- COMBOS -->
      <div v-show="tab==='combos'">
        <div class="card" v-for="c in combos" :key="c.id">
          <div class="row">
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="c.nombre"></div>
            <div><label>Precio</label><input v-model.number="c.precio" type="number"></div>
            <div><label>Emoji</label><input v-model="c.icon"></div>
            <div style="grid-column:span 2"><label>Descripción</label><input v-model="c.descripcion"></div>
            <div><label>Badge</label><input v-model="c.badge"></div>
            <div style="grid-column:span 2"><label>Nota (combo_hint)</label><input v-model="c.combo_hint"></div>
            <div><label>Stock</label><input v-model.number="c.stock" type="number"></div>
          </div>
          <div class="acts">
            <label class="chk"><input type="checkbox" v-model="c.envio_incluido"> Envío incluido</label>
            <label class="chk"><input type="checkbox" v-model="c.disponible"> Disponible</label>
            <span style="flex:1"></span>
            <button class="btn sm" @click="guardar('combos',c)">Guardar</button>
            <button class="btn gray sm" @click="eliminar('combos',c)">Eliminar</button>
          </div>
        </div>
        <div class="card">
          <b>Agregar combo</b>
          <div class="row" style="margin-top:8px">
            <div><label>id</label><input v-model="nuevo.combos.id" placeholder="combo-x"></div>
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="nuevo.combos.nombre"></div>
            <div><label>Precio</label><input v-model.number="nuevo.combos.precio" type="number"></div>
          </div>
          <div class="acts"><button class="btn sm" @click="agregar('combos')">Agregar</button></div>
        </div>
      </div>

      <!-- EXTRAS -->
      <div v-show="tab==='extras'">
        <div class="card" v-for="e in extras" :key="e.id">
          <div class="row">
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="e.nombre"></div>
            <div><label>Precio</label><input v-model.number="e.precio" type="number"></div>
            <div><label>Emoji</label><input v-model="e.icon"></div>
            <div><label>Color</label><select v-model="e.cat"><option>icee</option><option>dulce</option><option>salado</option></select></div>
            <div style="grid-column:span 2"><label>Descripción</label><input v-model="e.descripcion"></div>
            <div><label>Stock</label><input v-model.number="e.stock" type="number"></div>
          </div>
          <div class="acts">
            <label class="chk"><input type="checkbox" v-model="e.disponible"> Disponible</label>
            <span style="flex:1"></span>
            <button class="btn sm" @click="guardar('extras',e)">Guardar</button>
            <button class="btn gray sm" @click="eliminar('extras',e)">Eliminar</button>
          </div>
        </div>
        <div class="card">
          <b>Agregar extra</b>
          <div class="row" style="margin-top:8px">
            <div><label>id</label><input v-model="nuevo.extras.id" placeholder="ex-x"></div>
            <div style="grid-column:span 2"><label>Nombre</label><input v-model="nuevo.extras.nombre"></div>
            <div><label>Precio</label><input v-model.number="nuevo.extras.precio" type="number"></div>
          </div>
          <div class="acts"><button class="btn sm" @click="agregar('extras')">Agregar</button></div>
        </div>
      </div>

      <!-- TAMAÑOS -->
      <div v-show="tab==='tamanos'">
        <div class="card" v-for="cat in ['salado','dulce','icee']" :key="cat">
          <b>Precios · {{ cat==='salado'?'Saladas':(cat==='dulce'?'Dulces':'Icees') }}</b>
          <div class="row" style="margin-top:8px">
            <div v-for="t in tamanos" :key="t.id">
              <label>{{ t.nombre }}</label>
              <input v-model.number="preciosMatriz[cat+':'+t.id]" type="number">
            </div>
          </div>
        </div>
        <div class="acts"><button class="btn sm" @click="guardarPrecios">Guardar precios</button></div>

        <div class="card" v-for="t in tamanos" :key="t.id" style="margin-top:14px">
          <div class="row">
            <div><label>Id</label><input v-model="t.id" disabled></div>
            <div><label>Nombre</label><input v-model="t.nombre"></div>
            <div><label>Orden</label><input v-model.number="t.orden" type="number"></div>
          </div>
          <div class="acts">
            <span style="flex:1"></span>
            <button class="btn sm" @click="guardar('tamanos',t,'id')">Guardar</button>
            <button class="btn gray sm" @click="eliminar('tamanos',t,'id')">Eliminar</button>
          </div>
        </div>
        <div class="card">
          <b>Agregar tamaño</b>
          <div class="row" style="margin-top:8px">
            <div><label>Id (slug)</label><input v-model="nuevo.tamanos.id" placeholder="ej. mega"></div>
            <div><label>Nombre</label><input v-model="nuevo.tamanos.nombre"></div>
            <div><label>Orden</label><input v-model.number="nuevo.tamanos.orden" type="number"></div>
          </div>
          <div class="acts"><button class="btn sm" @click="agregar('tamanos','id')">Agregar</button></div>
        </div>
      </div>

      <!-- CONFIG -->
      <div v-show="tab==='config'">
        <div class="card">
          <div class="row">
            <div style="grid-column:span 2"><label>Negocio</label><input v-model="config.negocio"></div>
            <div style="grid-column:span 2"><label>WhatsApp (52 + 10 dígitos)</label><input v-model="config.whatsapp_numero"></div>
            <div><label>Pedido mínimo</label><input v-model.number="config.pedido_minimo" type="number"></div>
            <div><label>Anticipación (días)</label><input v-model.number="config.anticipacion_dias" type="number"></div>
            <div><label>Tope por sabor</label><input v-model.number="config.tope_por_sabor" type="number"></div>
            <div><label>Costo envío</label><input v-model.number="config.costo_envio" type="number"></div>
            <div><label>Anticipo (0-1)</label><input v-model.number="config.anticipo_pct" type="number" step="0.05"></div>
            <div><label>Abre (hora)</label><input v-model.number="config.hora_abre" type="number"></div>
            <div><label>Cierra (hora)</label><input v-model.number="config.hora_cierra" type="number"></div>
            <div style="grid-column:span 2"><label>Horario (texto)</label><input v-model="config.horario"></div>
          </div>
          <label style="margin-top:10px">Zonas (una por línea)</label>
          <textarea v-model="zonasTexto" rows="5"></textarea>
          <div class="acts"><button class="btn sm" @click="guardarConfig">Guardar configuración</button></div>
        </div>
      </div>

      <!-- PEDIDOS -->
      <div v-show="tab==='pedidos'">
        <p class="muted" v-if="!pedidos.length">Aún no hay pedidos registrados.</p>
        <div class="card" v-for="o in pedidos" :key="o.id">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <b>{{ o.cliente || 'Sin nombre' }}</b>
            <span class="muted">{{ fmt(o.creado) }}</span>
            <span class="pill" :class="o.estatus==='entregado'?'on':'off'">{{ o.estatus }}</span>
            <span style="flex:1"></span>
            <b>${{ o.total }}</b>
          </div>
          <div class="muted" style="margin-top:4px">
            Entrega: {{ o.entrega }}<template v-if="o.zona"> · {{ o.zona }}</template><template v-if="o.direccion"> · {{ o.direccion }}</template> · {{ o.pago }} · {{ o.piezas }} pzas · anticipo ${{ o.anticipo }}
          </div>
          <ul class="muted" style="margin:6px 0 0;padding-left:18px">
            <li v-for="(it,i) in o.items" :key="i">{{ it.nombre }} x{{ it.qty }} — ${{ it.importe }}</li>
          </ul>
          <p class="muted" v-if="o.notas" style="margin:6px 0 0">📝 {{ o.notas }}</p>
          <div class="acts">
            <select v-model="o.estatus" style="max-width:170px"><option>pendiente</option><option>confirmado</option><option>entregado</option><option>cancelado</option></select>
            <button class="btn sm" @click="guardarEstatus(o)">Actualizar</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <div v-if="toast" class="msg">{{ toast }}</div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
const SUPABASE_ANON_KEY = 'TU-ANON-KEY';
const USA_SB = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('TU-PROYECTO') && typeof supabase !== 'undefined';
const sb = USA_SB ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

createApp({
  setup(){
    const TABS=[{id:'resumen',label:'Resumen'},{id:'sabores',label:'Sabores'},{id:'combos',label:'Combos'},{id:'extras',label:'Extras'},{id:'tamanos',label:'Tamaños'},{id:'config',label:'Config'},{id:'pedidos',label:'Pedidos'}];
    const tab=ref('resumen');
    const sesion=ref(null); const email=ref(''); const password=ref(''); const loginErr=ref('');
    const toast=ref('');
    const sabores=ref([]), combos=ref([]), extras=ref([]), tamanos=ref([]), pedidos=ref([]);
    const preciosMatriz=reactive({});
    const config=reactive({});
    const zonasTexto=ref('');
    const nuevo=reactive({ sabores:{cat:'salado'}, combos:{}, extras:{cat:'icee'}, tamanos:{} });

    const aviso=(t)=>{ toast.value=t; setTimeout(()=>toast.value='',2200); };
    const fmt=(s)=> s? new Date(s).toLocaleString('es-MX') : '';
    const esHoy=(x)=>{ if(!x) return false; const d=new Date(x),n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); };
    const stats=computed(()=>{
      const P=pedidos.value, sum=(a,f)=>a.reduce((t,o)=>t+Number(o[f]||0),0);
      const hoy=P.filter(o=>esHoy(o.creado));
      const est={pendiente:0,confirmado:0,entregado:0,cancelado:0};
      P.forEach(o=>{ est[o.estatus]=(est[o.estatus]||0)+1; });
      const top={}; P.forEach(o=>(o.items||[]).forEach(it=>{ top[it.nombre]=(top[it.nombre]||0)+Number(it.qty||0); }));
      const topProductos=Object.entries(top).map(([nombre,qty])=>({nombre,qty})).sort((a,b)=>b.qty-a.qty).slice(0,5);
      return { total:P.length, hoyN:hoy.length, hoyMonto:sum(hoy,'total'),
        anticipos:sum(P.filter(o=>o.estatus==='pendiente'||o.estatus==='confirmado'),'anticipo'),
        ventas:sum(P.filter(o=>o.estatus==='confirmado'||o.estatus==='entregado'),'total'),
        est, topProductos, maxTop: topProductos.length?topProductos[0].qty:1 };
    });

    async function login(){
      loginErr.value='';
      const { data, error } = await sb.auth.signInWithPassword({ email:email.value, password:password.value });
      if(error){ loginErr.value=error.message||'No se pudo entrar'; return; }
      sesion.value=data.session; await cargarTodo();
    }
    async function logout(){ await sb.auth.signOut(); sesion.value=null; }

    async function cargarTodo(){
      const q=(t,ord)=> sb.from(t).select('*').order(ord);
      const [sa,co,ex,ta,pt,cf,pe]=await Promise.all([
        q('sabores','orden'), q('combos','orden'), q('extras','orden'), q('tamanos','orden'),
        sb.from('precios_tamano').select('*'),
        sb.from('config').select('*').single(),
        sb.from('orders').select('*').order('creado',{ascending:false})
      ]);
      sabores.value=sa.data||[]; combos.value=co.data||[]; extras.value=ex.data||[]; tamanos.value=ta.data||[];
      pedidos.value=pe.data||[];
      Object.keys(preciosMatriz).forEach(k=>delete preciosMatriz[k]);
      (pt.data||[]).forEach(r=>{ preciosMatriz[r.categoria+':'+r.tamano_id]=Number(r.precio); });
      if(cf.data){ Object.assign(config, cf.data); zonasTexto.value=(cf.data.zonas||[]).join('\n'); }
    }

    async function guardar(tabla, fila, pk='id'){
      const { error } = await sb.from(tabla).update(fila).eq(pk, fila[pk]);
      aviso(error? ('Error: '+error.message) : 'Guardado');
    }
    async function eliminar(tabla, fila, pk='id'){
      const { error } = await sb.from(tabla).delete().eq(pk, fila[pk]);
      if(!error){ const ref_={sabores,combos,extras,tamanos}[tabla]; ref_.value=ref_.value.filter(x=>x[pk]!==fila[pk]); }
      aviso(error? ('Error: '+error.message) : 'Eliminado');
    }
    async function agregar(tabla, pk='id'){
      const fila=nuevo[tabla];
      if(!fila[pk]){ aviso('Falta el '+pk); return; }
      const { error } = await sb.from(tabla).insert(fila);
      if(!error){ await cargarTodo(); nuevo[tabla]= tabla==='sabores'?{cat:'salado'}:(tabla==='extras'?{cat:'icee'}:{}); }
      aviso(error? ('Error: '+error.message) : 'Agregado');
    }
    async function guardarPrecios(){
      const rows=[];
      ['salado','dulce','icee'].forEach(cat=>{
        tamanos.value.forEach(t=>{
          const v=preciosMatriz[cat+':'+t.id];
          if(v!=null && v!=='') rows.push({categoria:cat, tamano_id:t.id, precio:v});
        });
      });
      const { error } = await sb.from('precios_tamano').upsert(rows, {onConflict:'categoria,tamano_id'});
      aviso(error? ('Error: '+error.message) : 'Precios guardados');
    }
    async function guardarConfig(){
      const payload={...config, id:1, zonas: zonasTexto.value.split('\n').map(z=>z.trim()).filter(Boolean)};
      const { error } = await sb.from('config').update(payload).eq('id',1);
      aviso(error? ('Error: '+error.message) : 'Configuración guardada');
    }
    async function guardarEstatus(o){
      const { error } = await sb.from('orders').update({estatus:o.estatus}).eq('id',o.id);
      aviso(error? ('Error: '+error.message) : 'Estatus actualizado');
    }

    onMounted(async ()=>{
      if(!sb) return;
      const { data } = await sb.auth.getSession();
      if(data && data.session){ sesion.value=data.session; await cargarTodo(); }
    });

    return { USA_SB, TABS, tab, sesion, email, password, loginErr, toast, fmt, stats,
      sabores, combos, extras, tamanos, preciosMatriz, pedidos, config, zonasTexto, nuevo,
      login, logout, guardar, eliminar, agregar, guardarPrecios, guardarConfig, guardarEstatus };
  }
}).mount('#app');
</script>
</body>
</html>
